paths:
  data_dir: /srv/proxy-filter/data

# Proxies that have passed the full qualifying pipeline at least once are kept
# in data/state/known-working.jsonl and re-tested on every fresh full run. A
# previously working proxy may fail temporarily and remain in this retained set;
# it expires only after its last successful run is older than this period.
state:
  working_retention_days: 30

filters:
  security:
    reject_allow_insecure: true
    reject_unknown_protocols: true

  tcp:
    enabled: true
    timeout_seconds: 3
    workers: 64

  latency:
    mode: singbox-api

    # Recovery is disabled by default: every proxy gets exactly one primary URL
    # test. Set true to allow one second attempt after an eligible runtime
    # failure. With fallback_url configured, that attempt uses the alternate
    # endpoint; without it, only transient failures are retried on primary_url.
    recovery_enabled: false
    primary_url: https://www.gstatic.com/generate_204
    fallback_url: https://www.cloudflare.com/cdn-cgi/trace
    timeout_seconds: 12

    # A negative value disables rejection by the measured latency while keeping
    # a successful primary or recovery URL test mandatory.
    max_ms: -1

    batch_size: 128
    workers: 32
    # Debug/curl mode only:
    command: curl

  speed:
    # Cloudflare is the primary download backend. The configured stream stages
    # are measurements, not retries: each number is one aggregate test using
    # that many parallel streams. [8] therefore means one eight-stream test;
    # [1, 4, 8] means three measurements. The best valid aggregate result wins.
    download_url: https://speed.cloudflare.com/__down?bytes=80000000
    download_streams: [8]

    # Skip a configured stage when its share of the fixed payload would be too
    # small for a meaningful measurement.
    download_min_stream_bytes: 5000000

    # Exactly one alternate download backend. It is used only for an eligible
    # provider failure of the primary backend. CacheFly runs the same configured
    # download_streams once; it is not retried and there is no further fallback.
    download_fallback_url: https://cachefly.cachefly.net/100mb.test

    # Upload uses the same configurable stage model. [8] is one eight-stream
    # measurement; any non-empty list of positive unique integers is allowed.
    # Upload keeps its existing HTTP-specific retry/fallback behavior.
    upload_url: https://speed.cloudflare.com/__up
    upload_bytes: 20000000
    upload_streams: [8]
    upload_min_stream_bytes: 1000000
    upload_fallback_urls: []
    upload_fallback_http_codes:
      - 429
      - 500
      - 502
      - 503
      - 504

    # Connection establishment and speed-transfer budgets are configured
    # separately. curl --max-time is their sum (10 + 30 = 40 seconds here),
    # so connection setup no longer consumes the configured transfer budget.
    # If an interrupted transfer still yields a numeric speed, the speed value
    # decides the threshold result. A transfer error rejects by error only when
    # no usable speed measurement was obtained.
    connect_timeout_seconds: 10
    transfer_timeout_seconds: 30
    min_download_mbps: 80
    min_upload_mbps: 30
    workers: 1
    command: curl

  exit_ip:
    url: https://api.ipify.org
    timeout_seconds: 8
    workers: 4
    command: curl

    # If the primary service fails or returns no valid IP, exactly one retry is
    # made through an independent service: https://checkip.amazonaws.com . A
    # valid primary response never triggers fallback, even if it matches WAN IP.

    # Reject confirmed direct-WAN leaks.
    reject_direct_wan_ip: true

    # If both exit-IP lookups fail, keep the proxy by default and mark the
    # result as unknown. Set true for strict fail-closed behavior.
    reject_unknown_exit_ip: false

    # Discover the server's current direct public IP using the same primary +
    # independent fallback lookup. For multi-WAN systems, list any additional
    # public WAN addresses in direct_ips so a leak through either ISP is rejected.
    auto_discover_direct_ip: true
    direct_ips: []

  # GeoIP is enrichment, not a rejection stage. Proxies with unknown exit IP
  # or a failed metadata lookup remain in the survivor set with geo status
  # unknown/error. Lookups are deduplicated by exit IP.
  geo:
    provider: ipwhois
    url_template: https://ipwho.is/{ip}
    timeout_seconds: 8
    workers: 4
    command: curl

# Long-term per-source availability history. The filtering pipeline uses one
# global set of JSONL work checkpoints; source provenance is stored in each
# proxy record. SQLite remains the analytical per-source history store.
#
# Normal full publish runs are recorded automatically when enabled=true.
# History is also an explicit non-filtering stage after publish:
#   --until history
# and an existing complete work snapshot can be imported without network tests:
#   --history-import --source radikal
# or equivalently:
#   --resume-from publish --until history --source radikal
# Snapshot imports are idempotent: importing unchanged work files again does not
# create another run. Failed source fetches never mark all previous proxies absent.
history:
  enabled: true

  # Absolute path, or relative to paths.data_dir. If omitted, the default is:
  # history/proxy-history.sqlite3 under data_dir.
  database: history/proxy-history.sqlite3

# Applied only to merged publication after all real proxy tests and the global
# canonical dedup. Exact exit IP duplicates are reduced first; only the winners
# then compete inside the broader exit-subnet + ASN cluster. The selected set is
# subsequently split by reliability into output/stable.* and output/unstable.*;
# output/all.* always contains both classes.
diversity:
  enabled: true
  max_same_exit_ip: 1
  max_same_exit_subnet_asn: 2
  ipv4_prefix: 24
  ipv6_prefix: 48

engine:
  backend: sing-box
  command: sing-box
  startup_timeout_seconds: 5
  shutdown_timeout_seconds: 3
  listen_host: 127.0.0.1
  runtime_dir: /srv/proxy-filter/data/runtime

output:
  # {sources} shows up to three contributing source ids joined with '+'.
  # With more than three sources it becomes e.g. 4src. {source} remains the
  # primary/first source; {source_count} is the full provenance count.
  # {stream_reliability} (alias {reliability}) is stable/degraded/unknown.
  rename_template: "{flag} {country_code} | {latency_ms}ms | ↓{download_mbps} ↑{upload_mbps} | {protocol} | [{sources}]"
  include_original_name: false

  # Append an explicit reliability:<status> marker to every rendered URI name,
  # unless the rename_template already contains {stream_reliability} or
  # {reliability}. Reliability no longer excludes a proxy before publication:
  # all.txt contains every diversity-selected proxy, stable.txt only stable,
  # and unstable.txt only degraded.
  include_stream_reliability: true
