paths:
  data_dir: /srv/proxy-filter/data

filters:
  security:
    reject_allow_insecure: true
    reject_unknown_protocols: true

  tcp:
    enabled: true
    timeout_seconds: 3
    workers: 64

  latency:
    mode: singbox-api
    test_url: https://www.gstatic.com/generate_204
    timeout_seconds: 12
    max_ms: 1200
    batch_size: 128
    workers: 32
    # Fallback/debug mode only:
    command: curl

  speed:
    # Primary speed-test endpoint. If it returns an HTTP status listed in
    # download_fallback_http_codes, retry the same proxy against the fallback.
    download_url: https://speed.cloudflare.com/__down?bytes=50000000
    download_fallback_urls:
      - https://cachefly.cachefly.net/100mb.test
    download_fallback_http_codes:
      - 429

    # Upload uses Cloudflare's public upload endpoint. If an upload ends after
    # only an interim HTTP 100 response, retry once against the same URL with
    # the Expect header disabled. Optional fallback URLs can then be tried for
    # another interim-100 failure or the configured HTTP status codes.
    upload_url: https://speed.cloudflare.com/__up
    upload_bytes: 20000000
    upload_fallback_urls: []
    upload_fallback_http_codes:
      - 429
      - 500
      - 502
      - 503
      - 504

    timeout_seconds: 30
    min_download_mbps: 80
    min_upload_mbps: 30
    workers: 1
    command: curl

  exit_ip:
    url: https://api.ipify.org
    timeout_seconds: 8
    workers: 4
    command: curl

    # Reject confirmed direct-WAN leaks.
    reject_direct_wan_ip: true

    # If the exit-IP lookup itself fails, keep the proxy by default and mark
    # the result as unknown. Set true for strict fail-closed behavior.
    reject_unknown_exit_ip: false

    # Discover the server's current direct public IP using the same endpoint
    # without a proxy. For multi-WAN systems, list any additional public WAN
    # addresses in direct_ips so a leak through either ISP is rejected.
    auto_discover_direct_ip: true
    direct_ips: []

  # GeoIP is enrichment, not a rejection stage. Proxies with unknown exit IP
  # or a failed metadata lookup remain in the survivor set with geo status
  # unknown/error. Lookups are deduplicated by exit IP.
  geo:
    provider: ipwhois
    url_template: https://ipwho.is/{ip}
    timeout_seconds: 8
    workers: 4
    command: curl

engine:
  backend: sing-box
  command: sing-box
  startup_timeout_seconds: 5
  shutdown_timeout_seconds: 3
  listen_host: 127.0.0.1
  runtime_dir: /srv/proxy-filter/data/runtime

output:
  # {sources} shows up to three contributing source ids joined with '+'.
  # With more than three sources it becomes e.g. 4src. {source} remains the
  # primary/first source; {source_count} is the full provenance count.
  rename_template: "{flag} {country_code} | {latency_ms}ms | ↓{download_mbps} ↑{upload_mbps} | {protocol} | [{sources}]"
  include_original_name: false
