name: staged-speed-tests

on:
  push:
    paths:
      - "proxyfilter/speed.py"
      - "proxyfilter/speed_staged.py"
      - "proxyfilter/__init__.py"
      - "tests/test_staged_speed.py"
      - ".github/workflows/staged-speed-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run staged speed unit tests
        run: python -m unittest discover -s tests -p 'test_staged_speed.py' -v
