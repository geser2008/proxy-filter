name: staged-speed-tests

on:
  push:
    paths:
      - "proxyfilter/speed.py"
      - "proxyfilter/speed_policy.py"
      - "proxyfilter/speed_reliability.py"
      - "proxyfilter/speed_semantics.py"
      - "proxyfilter/speed_staged.py"
      - "proxyfilter/payload_semantics.py"
      - "proxyfilter/__init__.py"
      - "proxyfilter/cli.py"
      - "config.example.yaml"
      - "tests/test_download_recovery.py"
      - "tests/test_upload_policy.py"
      - "tests/test_speed_acceptance.py"
      - "tests/test_speed_measurement_semantics.py"
      - "tests/test_speed_policy.py"
      - "tests/test_speed_threshold_semantics.py"
      - "tests/test_staged_speed.py"
      - ".github/workflows/staged-speed-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install PyYAML
      - name: Run speed policy unit tests
        run: |
          python -m unittest -v \
            tests.test_download_recovery \
            tests.test_upload_policy \
            tests.test_speed_acceptance \
            tests.test_speed_measurement_semantics \
            tests.test_speed_policy \
            tests.test_speed_threshold_semantics \
            tests.test_staged_speed
