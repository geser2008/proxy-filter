name: unit-tests

on:
  push:
    paths:
      - "proxy_filter.py"
      - "proxyfilter/**"
      - "tests/**"
      - "config.example.yaml"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "proxy_filter.py"
      - "proxyfilter/**"
      - "tests/**"
      - "config.example.yaml"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install PyYAML
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
